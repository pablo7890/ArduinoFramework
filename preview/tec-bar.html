<!-- Stand-in for TEC's own events bar (search, date picker, view switcher).
     On the live site TEC renders it; the plugin only recolours it. -->
<div class="tec-mock" aria-label="Pasek wyszukiwania The Events Calendar (podgląd)">
	<div class="tec-mock__search">
		<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
		<label for="tec-mock-q" class="screen-reader-text">Szukaj wydarzeń</label>
		<input id="tec-mock-q" type="search" placeholder="Szukaj wydarzeń">
		<button type="button">Znajdź wydarzenia</button>
	</div>
	<div class="tec-mock__views" role="group" aria-label="Widok">
		<span class="is-on">Lista</span><span>Miesiąc</span><span>Dzień</span>
	</div>
</div>
<div class="tec-mock-top">
	<span class="tec-mock-today">Dzisiaj</span>
	<span class="tec-mock-range">Nadchodzące ▾</span>
</div>
